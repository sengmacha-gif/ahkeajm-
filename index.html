<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Likea's Happy Cow Farm (iOS Touch Optimized) 🐮</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;700&family=Fredoka:wght@400;700&display=swap');

        :root {
            --farm-green: #7bed9f;
            --farm-bg: #eef9f2;
            --sky-blue: #70a1ff;
            --text-dark: #2f3542;
            --panel-white: rgba(255, 255, 255, 0.95);
            --shadow: 0 8px 24px rgba(46, 213, 115, 0.15);
        }

        * { 
            box-sizing: border-box; 
            font-family: 'Kantumruy Pro', sans-serif; 
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #e8f7ee 0%, #dff9fb 100%);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            color: var(--text-dark);
        }

        /* SIDEBAR / TOP NAVIGATION FOR MOBILE */
        #sidebar {
            width: 100%;
            background: var(--panel-white);
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: row;
            overflow-x: auto;
            padding: 10px;
            gap: 8px;
            z-index: 10;
            -webkit-overflow-scrolling: touch;
        }

        .brand { 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            padding: 0 10px;
            border-right: 2px solid #f1f2f6;
            min-width: 120px;
        }
        .brand h1 { 
            font-family: 'Fredoka', sans-serif;
            font-size: 16px; 
            color: #2ed573; 
            margin: 0; 
        }
        .brand span { font-size: 9px; color: #a4b0be; letter-spacing: 0.5px; }

        .menu-btn {
            background: #fff;
            border: 2px solid #f1f2f6;
            padding: 8px 12px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            color: #57606f;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
            transition: all 0.2s ease;
        }

        .menu-btn.active {
            background: #2ed573;
            color: white;
            border-color: #2ed573;
        }

        /* MAIN GAMING STAGE */
        #main-stage {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            position: relative;
            touch-action: none; /* Prevents iOS safari bouncing */
        }

        #game-card {
            background: var(--panel-white);
            border-radius: 20px;
            padding: 12px;
            box-shadow: var(--shadow);
            border: 4px solid #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            width: 100%;
            max-width: 460px;
        }

        .game-header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .game-title { font-size: 15px; font-weight: bold; color: #2c3e50; margin: 0; }
        .status-badge {
            background: #ffa502;
            color: white;
            padding: 4px 10px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 12px;
        }

        canvas {
            background: #f7fcf9;
            border-radius: 12px;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.03);
            width: 100%;
            height: auto;
            max-height: 70vh;
            touch-action: none;
        }

        /* INTERFACE POPUPS FOR MOBILE TOUCH */
        .overlay-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.97);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 20;
            padding: 20px;
        }

        .overlay-screen.show { 
            opacity: 1; 
            pointer-events: auto; 
        }

        .intro-title {
            font-family: 'Fredoka', sans-serif;
            font-size: 22px;
            color: #2ed573;
            margin-bottom: 8px;
        }

        .intro-hi {
            background: #e8f7ee;
            color: #2ed573;
            padding: 12px 15px;
            border-radius: 12px;
            border: 1px solid rgba(46, 213, 115, 0.3);
            font-size: 13px;
            font-weight: bold;
            text-align: center;
            max-width: 90%;
            line-height: 1.5;
            margin-bottom: 18px;
        }

        .message-content {
            background: #ff4757;
            color: #fff;
            padding: 14px 20px;
            border-radius: 14px;
            border: 2px solid #fff;
            font-size: 13px;
            font-weight: 700;
            text-align: center;
            max-width: 90%;
            box-shadow: 0 4px 12px rgba(255, 71, 87, 0.2);
            line-height: 1.5;
        }

        .overlay-screen.win-style .message-content {
            background: #2ed573;
            box-shadow: 0 4px 12px rgba(46, 213, 115, 0.2);
        }

        .start-btn {
            background: #2ed573;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 30px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(46, 213, 115, 0.3);
            -webkit-appearance: none;
        }

        .restart-btn {
            margin-top: 15px;
            background: #2f3542;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            font-size: 12px;
            -webkit-appearance: none;
        }
    </style>
</head>
<body>

    <div id="sidebar">
        <div class="brand">
            <h1>COW FARM 🐮</h1>
            <span>For Likea 🌸</span>
        </div>
        <div class="menu-btn active" onclick="switchGame(0, this)">🌾 ស៊ីស្មៅ</div>
        <div class="menu-btn" onclick="switchGame(1, this)">🚜 គេចត្រាក់ទ័រ</div>
        <div class="menu-btn" onclick="switchGame(2, this)">⛈️ គេចផ្លេកបន្ទោរ</div>
        <div class="menu-btn" onclick="switchGame(3, this)">🍎 ប្រមូលប៉ោម</div>
    </div>

    <div id="main-stage">
        <div id="game-card">
            <div class="game-header">
                <span class="game-title" id="current-title">Cow Grass Finder</span>
                <span class="status-badge" id="timer-display">Time: 20.0s</span>
            </div>
            
            <canvas id="arcCanvas" width="440" height="400"></canvas>

            <div id="intro-screen" class="overlay-screen show">
                <div class="intro-title">🐮 Happy Cow Farm 🌾</div>
                <div class="intro-hi">
                    សួស្តីលីគាអាល្អិត! ស៊ូៗណា៎លេងហ្គេមកូនគោនេះឱ្យឈ្នះ ២០ វិនាទីទៅ! មើលទៅឯងដើរយឺតជាងកូនគោហ្នឹងទៀតអាកាតឿអើយ ឌឺមួយមើល! 🤪 លេងចាញ់កុំយំឱ្យ anh លួងណា៎!
                </div>
                <button class="start-btn" onclick="closeIntro()">START GAME 🚀</button>
            </div>

            <div id="screen-popup" class="overlay-screen">
                <div class="message-content" id="popup-content-text">...</div>
                <button class="restart-btn" onclick="restartGame()">👉 លេងម្តងទៀត 👈</button>
            </div>
        </div>
    </div>

<script>
    const canvas = document.getElementById("arcCanvas");
    const ctx = canvas.getContext("2d");
    const timerDisplay = document.getElementById("timer-display");
    const currentTitle = document.getElementById("current-title");
    const introScreen = document.getElementById("intro-screen");
    const popup = document.getElementById("screen-popup");
    const popupText = document.getElementById("popup-content-text");

    let currentGameIndex = 0;
    let cowX = 220, cowY = 200; // Position handles touch inputs directly
    let timeRemaining = 20.0; 
    let lastTime = Date.now();
    let isGameOver = true; 
    let spawnTimer = 0;
    let entities = [];

    const jeaPhrases = [
        "🎉 អូហូ! ឈ្នះបាត់ទៅហើយ! ឌឺសាហាវណាស់មេ បញ្ជាកូនគោស៊ីស្មៅលឿនដូចរន្ទះចឹង! 🐮🌾",
        "🎉 រស់បាន ២០ វិនាទីបាត់! កូនគោលីគាខ្លាំងគ្រាន់បើដែរតើ មិនអន់ទេវើយ! 😎"
    ];

    const burnoutPhrase = "❤️ មិនអីទេលីគាសម្លាញ់ បើហត់នឿយនឹងមនុស្សជុំវិញខ្លួន ឬពិភពលោកខាងក្រៅពេក ត្រលប់មកសម្រាកក្នុងពិភពតូចមួយនេះសិនមកណា មិត្តម្នាក់នេះនៅក្បែរការពារលីគាជានិច្ច! 🌸";

    // UNIVERSAL POSITION UPDATER FOR MOBILE TOUCH INPUTS
    function handleTouchInput(e) {
        if (isGameOver) return;
        e.preventDefault(); // Lock iOS scrolling/bounce behavior completely inside canvas
        
        const rect = canvas.getBoundingClientRect();
        const touch = e.touches[0];
        
        // Calculate the exact scaling factor if the canvas shrunk on mobile screens
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;

        // Set local coordinates bounds
        let targetX = (touch.clientX - rect.left) * scaleX;
        let targetY = (touch.clientY - rect.top) * scaleY;

        // Constraint within canvas boundaries
        if (targetX >= 0 && targetX <= canvas.width) cowX = targetX;
        if (targetY >= 0 && targetY <= canvas.height) cowY = targetY;
    }

    canvas.addEventListener("touchstart", handleTouchInput, { passive: false });
    canvas.addEventListener("touchmove", handleTouchInput, { passive: false });

    function closeIntro() {
        introScreen.classList.remove("show");
        restartGame();
    }

    function triggerWin() {
        isGameOver = true;
        popupText.innerText = jeaPhrases[Math.floor(Math.random() * jeaPhrases.length)];
        popup.classList.add("show", "win-style");
    }

    function triggerLoss() {
        isGameOver = true;
        popupText.innerText = burnoutPhrase;
        popup.classList.add("show");
        popup.classList.remove("win-style");
    }

    function restartGame() {
        isGameOver = false;
        timeRemaining = 20.0;
        lastTime = Date.now();
        entities = [];
        spawnTimer = 0;
        popup.classList.remove("show");
    }

    function switchGame(index, btnElement) {
        document.querySelectorAll('.menu-btn').forEach(btn => btn.classList.remove('active'));
        btnElement.classList.add('active');
        currentGameIndex = index;

        if (index === 0) currentTitle.innerText = "Cow Grass Finder";
        else if (index === 1) currentTitle.innerText = "Tractor Dodger";
        else if (index === 2) currentTitle.innerText = "Storm Shelter Run";
        else if (index === 3) currentTitle.innerText = "Apple Collector";

        introScreen.classList.remove("show");
        restartGame();
    }

    function drawCuteCow(x, y) {
        ctx.fillStyle = "#ffffff"; ctx.beginPath(); ctx.ellipse(x, y, 26, 20, 0, 0, Math.PI*2); ctx.fill();
        ctx.strokeStyle = "#eedec9"; ctx.lineWidth = 2; ctx.stroke();
        ctx.fillStyle = "#2f3542";
        ctx.beginPath(); ctx.arc(x - 8, y - 6, 7, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(x + 10, y + 4, 5, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = "#ffffff"; ctx.beginPath(); ctx.arc(x - 20, y - 10, 13, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = "#ffb8b8"; ctx.beginPath(); ctx.ellipse(x - 24, y - 6, 9, 6, 0, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = "#000000"; ctx.beginPath(); ctx.arc(x - 24, y - 12, 2, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = "#f1bbc1";
        ctx.beginPath(); ctx.moveTo(x - 18, y - 22); ctx.lineTo(x - 22, y - 29); ctx.lineTo(x - 14, y - 22); ctx.fill();
    }

    function gameLoop() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        ctx.fillStyle = "#eaf7ee";
        for(let i=0; i<8; i++) {
            let gx = (i * 85) % canvas.width;
            let gy = (i * 120) % canvas.height;
            ctx.fillStyle = "#badc58"; ctx.fillRect(gx, gy, 6, 4);
        }

        if (!isGameOver) {
            let now = Date.now();
            let delta = (now - lastTime) / 1000;
            lastTime = now;
            timeRemaining -= delta;

            if (timeRemaining <= 0) {
                timeRemaining = 0;
                triggerWin();
            }
            spawnTimer++;
        } else {
            lastTime = Date.now();
        }

        timerDisplay.innerText = "Time: " + timeRemaining.toFixed(1) + "s";

        if(!introScreen.classList.contains("show")) {
            drawCuteCow(cowX, cowY);
        }

        // CHILL MODE EASY TOUCH LOGICS
        if (currentGameIndex === 0) {
            if (!isGameOver && spawnTimer % 35 === 0) {
                entities.push({ x: Math.random() * (canvas.width - 40) + 20, y: 0, speed: 1.8 + Math.random()*1.0 });
            }
            for (let i = entities.length - 1; i >= 0; i--) {
                let g = entities[i]; if(!isGameOver) g.y += g.speed;
                ctx.fillStyle = "#ff4757"; ctx.beginPath(); ctx.arc(g.x, g.y, 10, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = "#ffa502"; ctx.beginPath(); ctx.arc(g.x, g.y, 4, 0, Math.PI*2); ctx.fill();

                if (Math.hypot(cowX - g.x, cowY - g.y) < 24) triggerLoss();
                if (g.y > canvas.height) entities.splice(i, 1);
            }
        }

        else if (currentGameIndex === 1) {
            if (!isGameOver && spawnTimer % 45 === 0) {
                entities.push({ x: canvas.width, y: Math.random() * (canvas.height - 80) + 40, speed: 2.0 });
            }
            for (let i = entities.length - 1; i >= 0; i--) {
                let t = entities[i]; if(!isGameOver) t.x -= t.speed;
                ctx.fillStyle = "#ffa502"; ctx.fillRect(t.x, t.y, 42, 22);
                ctx.fillStyle = "#2f3542"; ctx.beginPath(); ctx.arc(t.x+10, t.y+22, 6, 0, Math.PI*2); ctx.fill();

                if (cowX + 18 > t.x && cowX - 18 < t.x + 42 && cowY + 14 > t.y && cowY - 14 < t.y + 22) triggerLoss();
                if (t.x + 50 < 0) entities.splice(i, 1);
            }
        }

        else if (currentGameIndex === 2) {
            if (!isGameOver && spawnTimer % 38 === 0) {
                entities.push({ x: Math.random() * canvas.width, y: 0, speed: 2.4 });
            }
            for (let i = entities.length - 1; i >= 0; i--) {
                let l = entities[i]; if(!isGameOver) l.y += l.speed;
                ctx.fillStyle = "#eccc68"; ctx.beginPath();
                ctx.moveTo(l.x, l.y); ctx.lineTo(l.x-6, l.y+12); ctx.lineTo(l.x+2, l.y+12); ctx.lineTo(l.x-3, l.y+22); ctx.fill();

                if (Math.hypot(cowX - l.x, cowY - l.y) < 23) triggerLoss();
                if (l.y > canvas.height) entities.splice(i, 1);
            }
        }

        else if (currentGameIndex === 3) {
            if (!isGameOver && spawnTimer % 35 === 0) {
                entities.push({ x: Math.random() * (canvas.width - 40) + 20, y: 0, speed: 1.4 });
            }
            for (let i = entities.length - 1; i >= 0; i--) {
                let a = entities[i]; if(!isGameOver) a.y += a.speed;
                ctx.fillStyle = "#ff6b81"; ctx.beginPath(); ctx.arc(a.x, a.y, 10, 0, Math.PI*2); ctx.fill();

                let dist = Math.hypot(cowX - a.x, cowY - a.y);
                if (dist < 58 && !isGameOver) { 
                    entities.splice(i, 1);
                    continue;
                }
                if (a.y > canvas.height - 15) triggerLoss();
            }
        }

        requestAnimationFrame(gameLoop);
    }

    gameLoop();
</script>
</body>
</html>
